# A trimmed-down Clash config used by the examples and by `rulegraph compile`.
# Only the `rules:` block is read; the rest is here so the file is realistic.

mixed-port: 7890
allow-lan: false
mode: rule
log-level: info

dns:
  enable: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
    - https://223.5.5.5/dns-query
    - https://1.1.1.1/dns-query

proxies:
  - name: hk-01
    type: ss
    server: 203.0.113.10
    port: 30443
    cipher: aes-256-gcm
    password: example-only
  - name: jp-01
    type: trojan
    server: 203.0.113.20
    port: 443
    password: example-only
    sni: jp.example.net

proxy-groups:
  - name: Proxy
    type: select
    proxies: [hk-01, jp-01]
  - name: Media
    type: select
    proxies: [jp-01, hk-01]
  - name: AdBlock
    type: select
    proxies: [REJECT, DIRECT]

rules:
  - DOMAIN,localhost,DIRECT
  - DOMAIN-SUFFIX,lan,DIRECT
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
  - IP-CIDR6,fc00::/7,DIRECT,no-resolve
  - IP-CIDR6,fe80::/10,DIRECT,no-resolve

  - DOMAIN-SUFFIX,doubleclick.net,AdBlock
  - DOMAIN-KEYWORD,adservice,AdBlock
  - DOMAIN-SUFFIX,googlesyndication.com,AdBlock

  - DOMAIN,api.github.com,DIRECT
  - DOMAIN-SUFFIX,github.com,DIRECT
  - DOMAIN-SUFFIX,githubusercontent.com,DIRECT

  - DOMAIN-SUFFIX,openai.com,Proxy
  - DOMAIN-SUFFIX,anthropic.com,Proxy
  - DOMAIN-KEYWORD,telemetry,Proxy

  - DOMAIN-SUFFIX,netflix.com,Media
  - DOMAIN-SUFFIX,nflxvideo.net,Media
  - DOMAIN-SUFFIX,youtube.com,Media

  - DOMAIN-SUFFIX,cn,DIRECT
  - IP-CIDR,223.5.5.5/32,DIRECT
  - IP-CIDR,119.29.29.29/32,DIRECT

  - MATCH,Proxy